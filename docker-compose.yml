# =========================================================================
# SandbeltOS - 一键全栈编排
# 用法：
#   cp .env.example .env  &&  vim .env   # 填 DB 密码 / LLM key / API URL
#   docker compose up -d --build
# 详见 docs/docker.md
# =========================================================================

services:

  # -----------------------------------------------------------------------
  # PostgreSQL 16 + TimescaleDB + PostGIS
  # 用 timescale HA 镜像：同时自带 postgis & timescaledb 扩展
  # init.sql 会在空库首次启动时自动执行
  # -----------------------------------------------------------------------
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: sandbelt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sandbelt_db}
      POSTGRES_USER: ${POSTGRES_USER:-sandbelt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置强密码}
      # 关掉 HA 镜像的 patroni（单机部署用不到）
      PATRONI_DISABLE: "true"
    volumes:
      - ./data/postgres:/home/postgres/pgdata/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sandbelt} -d ${POSTGRES_DB:-sandbelt_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 本地调试时可以开放，生产只让 backend 连（不暴露外网）
    # ports:
    #   - "127.0.0.1:5432:5432"

  # -----------------------------------------------------------------------
  # Redis 7
  # -----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sandbelt-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data

  # -----------------------------------------------------------------------
  # pgBouncer (optional connection pooler)
  #
  # Gated by the `scale` profile — `docker compose up -d` skips it by
  # default; bring it up with `docker compose --profile scale up -d`
  # when you want transaction-level pooling (e.g. many uvicorn workers
  # behind nginx, or serverless callers). Then point the backend at
  # pgbouncer:6432 instead of postgres:5432 via DATABASE_URL.
  # -----------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: sandbelt-pgbouncer
    restart: unless-stopped
    profiles: ["scale"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-sandbelt}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置强密码}
      DB_NAME: ${POSTGRES_DB:-sandbelt_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy

  # -----------------------------------------------------------------------
  # Backend · FastAPI
  # -----------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sandbelt-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 覆盖 .env 里的本地地址，指向 compose 服务名
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sandbelt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sandbelt_db}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-sandbelt}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sandbelt_db}
      REDIS_URL: redis://redis:6379/0
      GEE_KEY_FILE: /app/secrets/gee-key.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # 密钥（只读）
      - ./secrets:/app/secrets:ro
      # 向量库持久化
      - ./data/chroma:/app/rag/chroma_store
      # RAG 原始 PDF
      - ./data/rag_docs:/app/rag/docs
      # HuggingFace 模型缓存（bge-m3 / bge-reranker，~2.5GB）
      - ./data/hf_cache:/root/.cache/huggingface
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  # -----------------------------------------------------------------------
  # Prometheus + Grafana (optional observability stack)
  #
  # Gated by the `obs` profile — `docker compose up -d` skips them by
  # default. Bring up with `docker compose --profile obs up -d` to scrape
  # backend:8000/metrics and visualize the bundled "SandbeltOS API"
  # dashboard at http://localhost:${GRAFANA_PORT:-3001} (admin/admin).
  # -----------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sandbelt-prometheus
    restart: unless-stopped
    profiles: ["obs"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: sandbelt-grafana
    restart: unless-stopped
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

  # -----------------------------------------------------------------------
  # Frontend · Next.js
  # NEXT_PUBLIC_API_URL 必须在 build 时注入，见 docs/docker.md §"关键注意事项"
  # -----------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: sandbelt-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
